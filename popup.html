<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Jimaku API Key</title>
    <style>
      body {
        font-family: sans-serif;
        width: 240px;
        padding: 12px;
      }
      h3 {
        margin: 0 0 8px;
        font-size: 14px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        margin-bottom: 8px;
      }
      button {
        width: 100%;
        padding: 6px;
        cursor: pointer;
      }
      #status {
        font-size: 12px;
        color: #1a7f37;
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <h3>Jimaku API Key</h3>
    <input type="password" id="apiKeyInput" placeholder="Paste your Jimaku API key" />
    <button id="saveBtn">Save</button>
    <p id="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
